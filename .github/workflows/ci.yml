# Builds and tests Atom on GitHub's disposable runners. Atom is NEVER built or tested on a personal machine:
# on 2026-11-25 a test cleanup that followed a symlink to "/" deleted the owner's files. Everything runs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Refuse unsafe recursive deletes
        # Kotlin's deleteRecursively() follows symlinks. Use atom.core.io.deleteTreeNoFollow() instead.
        run: |
          if git grep -n "deleteRecursively" -- ':!engine/llamacpp/third_party' ':!*.md' ':!.github/**' \
               | grep -v "core/src/main/kotlin/atom/core/io/SafeFiles.kt" \
               | grep -v "linux/src/test/kotlin/atom/linux/TestFiles.kt"; then
            echo "::error::deleteRecursively() follows symlinks; use deleteTreeNoFollow()"
            exit 1
          fi

      - name: Refuse references to other apps
        # Atom is presented on its own. The only allowed hit is the Greek letter in the LaTeX table.
        run: |
          if git grep -nIiP '\b(eta|buddy)\b' -- ':!engine/llamacpp/third_party' ':!.github/**' \
               | grep -vF '"eta" to "η"'; then
            echo "::error::Remove references to other apps (see lines above)"
            exit 1
          fi

      - name: Refuse build-tool traces
        # Development tooling leaves no marks in the repository: no tool settings, no attribution lines, no
        # temp or home paths of a developer machine (also inside committed binaries, hence -a). Anthropic's
        # models are a product feature and stay. The models.dev snapshot is the upstream catalog verbatim; it
        # lists third-party model ids. The patterns below are written so they do not match this file.
        run: |
          pattern='claude[ -]code|claude\.ai/code|co-authored-by:\s*claude|/tmp/[c]laude|\.[c]laude/'
          if git grep -n -o -a -i -P "$pattern" -- ':!engine/llamacpp/third_party' \
               ':!llm/cloud/src/main/resources/atom/llm/cloud/models_dev_snapshot.json'; then
            echo "::error::Remove build-tool traces (see lines above)"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.[c]laude/'; then
            echo "::error::Tool settings directories must not be committed"
            exit 1
          fi
          # Committed native binaries must not carry host build paths (__FILE__ strings, debug info).
          bad=0
          while IFS= read -r f; do
            if strings -a "$f" | grep -E '/Users/|/home/|/private/|/tmp/[c]laude'; then
              echo "::error file=$f::host build paths in a committed binary"
              bad=1
            fi
          done < <(git ls-files -- '*.so' '*.a' '*.o' ':!engine/llamacpp/third_party')
          exit $bad

      - name: Refuse build-tool attribution in commit messages
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | "\(.sha[0:10]) \(.commit.message | gsub("\n"; " "))"' > "$RUNNER_TEMP/pr-commits.txt"
          echo "$(wc -l < "$RUNNER_TEMP/pr-commits.txt") commits in this pull request"
          if grep -i -P 'co-authored-by:\s*claude|claude\.ai/code|claude-[s]ession' "$RUNNER_TEMP/pr-commits.txt"; then
            echo "::error::Commit messages must not carry build-tool attribution (see lines above)"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test testDebugUnitTest --continue --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Check packaged PRoot
        # PRoot is built from source by :linux:buildProot. It must be in the APK, and like every packaged
        # native library it must not carry paths of a developer machine.
        run: |
          libs="$RUNNER_TEMP/apk-libs"
          unzip -q -o app/build/outputs/apk/debug/app-debug.apk 'lib/*' -d "$libs"
          ls -l "$libs/lib/arm64-v8a/libproot.so" "$libs/lib/arm64-v8a/libproot_loader.so"
          file "$libs/lib/arm64-v8a/libproot.so" "$libs/lib/arm64-v8a/libproot_loader.so"
          bad=0
          for f in "$libs"/lib/*/*.so; do
            if strings -a "$f" | grep -E '/Users/|/private/|/tmp/[c]laude'; then
              echo "::error::host build paths in $(basename "$f")"
              bad=1
            fi
          done
          for f in "$libs/lib/arm64-v8a/libproot.so" "$libs/lib/arm64-v8a/libproot_loader.so"; do
            if strings -a "$f" | grep -F "$GITHUB_WORKSPACE"; then
              echo "::error::build paths in $(basename "$f")"
              bad=1
            fi
          done
          exit $bad

      # The minified (R8) release variant, unsigned: it has no signingConfig. Signing happens only in release.yml.
      # Building it here shows shrinker and lint-vital problems on the pull request instead of on main.
      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report APK size
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "::notice title=Release APK size::$(basename "$apk"): $(( $(stat -c %s "$apk") / 1024 / 1024 )) MB"
            unzip -lv "$apk" | awk 'NR>3 && $8 != "" {print $3, $1, $8}' | sort -rn | head -n 12
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: atom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
