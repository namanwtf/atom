# One-to-one comparison of the new Atom against the previous Atom (the latest 3.4.x release of namanwtf/atom-old):
# same emulator, same local model (llama.cpp on this runner, no API key), same tasks, one app after the other.
# Both apps are release builds, set up only through their own screens and measured the same way through
# tools/compare/proxy.py. See docs/TESTING.md. Like every Atom build, this runs only on GitHub's disposable runners.
#
# Separate from the per-PR build job: it runs on demand, and on the release PR (release/next into main).
name: Compare

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: true

env:
  OLD_REPO: namanwtf/atom-old
  OLD_SERIES: "3.4."
  LLAMA_TAG: b12500
  LLAMA_ASSET: llama-b12500-bin-ubuntu-x64.tar.gz
  LLAMA_SHA256: "decd26836af2cb9e0925e3bd5c79f7aa3740df9f2dbe88bbc57b1b4249cfd7ea"
  MODEL_REPO: Qwen/Qwen2.5-3B-Instruct-GGUF
  MODEL_REVISION: 7dabda4d13d513e3e842b20f0d435c732f172cbe
  MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
  MODEL_SHA256: "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d"
  MODEL_ALIAS: qwen2.5-3b-instruct
  # Room for the larger of the two apps' first requests plus a few steps.
  CTX_SIZE: "65536"

jobs:
  compare:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download the previous Atom (latest ${{ env.OLD_SERIES }}x release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old"
          tag=$(gh api "repos/$OLD_REPO/releases?per_page=100" \
            --jq "[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | ltrimstr(\"v\") | startswith(\"$OLD_SERIES\")))] | first | .tag_name")
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::No $OLD_SERIES release in $OLD_REPO"; exit 1; }
          asset=$(gh api "repos/$OLD_REPO/releases/tags/$tag" --jq '[.assets[] | select(.name | test("\\.apk$")) | select(.name | test("ondevice") | not)] | first | .name')
          gh release download "$tag" --repo "$OLD_REPO" --pattern "$asset" --dir "$RUNNER_TEMP/old"
          mv "$RUNNER_TEMP/old/$asset" "$RUNNER_TEMP/old/old.apk"
          echo "OLD_TAG=$tag" >> "$GITHUB_ENV"
          echo "::notice title=Old app::$OLD_REPO $tag ($asset, $(stat -c %s "$RUNNER_TEMP/old/old.apk") bytes)"

      - name: Download llama.cpp server
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          curl -fsSL --retry 3 -o "$LLAMA_ASSET" "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/$LLAMA_ASSET"
          echo "$LLAMA_SHA256  $LLAMA_ASSET" | sha256sum -c -
          tar xzf "$LLAMA_ASSET"
          server=$(find "$PWD" -type f -name llama-server | head -n1)
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LLAMA_LIB=$(dirname "$server")" >> "$GITHUB_ENV"

      - name: Cache the model
        uses: actions/cache@v5
        with:
          path: ~/e2e-model
          key: e2e-gguf-${{ env.MODEL_SHA256 }}

      - name: Download and verify the model
        run: |
          set -euo pipefail
          mkdir -p ~/e2e-model
          if ! echo "$MODEL_SHA256  $HOME/e2e-model/model.gguf" | sha256sum -c - 2>/dev/null; then
            curl -fsSL --retry 3 -o ~/e2e-model/model.gguf "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE"
            echo "$MODEL_SHA256  $HOME/e2e-model/model.gguf" | sha256sum -c -
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install NDK, CMake and build tools
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;4.1.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the new release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # The release build has no signing config. A throwaway key makes it installable here; both apps share the
      # application id and have different keys, so each is uninstalled before the other is installed.
      - name: Sign the new APK with a throwaway key
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          unsigned=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway -keypass throwaway \
            -alias t -keyalg RSA -keysize 2048 -validity 2 -dname "CN=compare" >/dev/null
          "$bt/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/new-aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/throwaway.jks" --ks-pass pass:throwaway --out "$RUNNER_TEMP/new.apk" "$RUNNER_TEMP/new-aligned.apk"
          echo "::notice title=New app::$(basename "$unsigned") $(stat -c %s "$unsigned") bytes unsigned"
          for apk in "$RUNNER_TEMP/old/old.apk" "$RUNNER_TEMP/new.apk"; do
            "$bt/aapt2" dump badging "$apk" | grep -E "^package:"
          done

      - name: Start the model server and the logging proxy
        run: |
          nohup env LD_LIBRARY_PATH="$LLAMA_LIB" "$LLAMA_SERVER" \
            -m ~/e2e-model/model.gguf --alias "$MODEL_ALIAS" --jinja \
            --host 127.0.0.1 --port 8080 --ctx-size "$CTX_SIZE" -np 1 -t 4 -tb 4 \
            --cache-reuse 256 --metrics > "$RUNNER_TEMP/llama-server.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 2
          done
          nohup python3 tools/compare/proxy.py 8081 http://127.0.0.1:8080 "$RUNNER_TEMP/proxy.jsonl" > "$RUNNER_TEMP/proxy.out" 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8081/v1/models

      # The emulator needs the runner's memory more than the idle Gradle and Kotlin daemons do.
      - name: Free memory for the emulator
        run: |
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pillow
        run: pip install --quiet pillow

      - name: Old app, then new app
        timeout-minutes: 300
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SHOT_DIR: compare-shots
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall io.github.namanwtf.atom || true
            adb install -r -g "$RUNNER_TEMP/old/old.apk"
            python3 tools/compare/run.py old "$RUNNER_TEMP/old.json" || true
            adb uninstall io.github.namanwtf.atom || true
            adb install -r -g "$RUNNER_TEMP/new.apk"
            python3 tools/compare/run.py new "$RUNNER_TEMP/new.json" || true
            adb uninstall io.github.namanwtf.atom || true

      - name: Host memory after the emulator
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' | tail -n 20 || true

      - name: Report
        if: always()
        run: |
          python3 tools/compare/report.py "$RUNNER_TEMP/old.json" "$RUNNER_TEMP/new.json" "$RUNNER_TEMP/proxy.jsonl" \
            "$RUNNER_TEMP/old/old.apk" "$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          echo "Old app: $OLD_REPO $OLD_TAG"

      - name: Model server log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/llama-server.log" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compare
          path: |
            compare-shots/
            ${{ runner.temp }}/old.json
            ${{ runner.temp }}/new.json
            ${{ runner.temp }}/proxy.jsonl
            ${{ runner.temp }}/llama-server.log
          retention-days: 14
