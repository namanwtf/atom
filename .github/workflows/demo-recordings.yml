# Launch demo clips: full-resolution screen recordings of real Atom runs on an emulator, against a model served on this
# runner by llama.cpp (no API key or secret), plus an on-device model in the offline clip. Same set-up as e2e.yml.
# The clips are printed into the job log as base64 (tools/demo/record.py); speed-ups are added in editing, labelled.
# Runs only for the media/launch-recordings pull request, which is never merged.
name: Demo recordings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/demo-recordings.yml"
      - "tools/demo/**"

permissions:
  contents: read

concurrency:
  group: demo-recordings-${{ github.ref }}
  cancel-in-progress: true

env:
  # llama.cpp server, prebuilt for Linux x64 (CPU). Pinned tag and archive checksum.
  LLAMA_TAG: b12500
  LLAMA_ASSET: llama-b12500-bin-ubuntu-x64.tar.gz
  LLAMA_SHA256: "decd26836af2cb9e0925e3bd5c79f7aa3740df9f2dbe88bbc57b1b4249cfd7ea"
  # The model: Qwen2.5 3B Instruct, Q4_K_M (about 2 GB). Small enough for 4 vCPUs / 16 GB, fast enough on the CPU, and
  # its chat template has native tool calling (llama-server --jinja parses it). Pinned repo, revision, file, checksum.
  MODEL_REPO: Qwen/Qwen2.5-3B-Instruct-GGUF
  MODEL_REVISION: 7dabda4d13d513e3e842b20f0d435c732f172cbe
  MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
  MODEL_SHA256: "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d"
  MODEL_ALIAS: qwen2.5-3b-instruct
  # Room for Atom's first request (system prompt plus every tool's schema) and a few steps of history.
  CTX_SIZE: "32768"

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'media/launch-recordings'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # First, so a wrong pin fails in seconds instead of after the build.
      - name: Download llama.cpp server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          curl -fsSL --retry 3 -o "$LLAMA_ASSET" "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/$LLAMA_ASSET" || true
          actual=$(sha256sum "$LLAMA_ASSET" 2>/dev/null | cut -d' ' -f1)
          if [ "$actual" != "$LLAMA_SHA256" ]; then
            # Prints what a new pin needs: the release date and each Linux asset's digest.
            echo "::error::$LLAMA_ASSET sha256 is '$actual', expected $LLAMA_SHA256"
            gh api "repos/ggml-org/llama.cpp/releases/tags/$LLAMA_TAG" --jq '.published_at, (.assets[] | select(.name | test("ubuntu|linux")) | "\(.name) \(.digest)")' || true
            echo "PIN_PROBLEM=1" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$LLAMA_ASSET" in *.zip) unzip -q "$LLAMA_ASSET" ;; *) tar xzf "$LLAMA_ASSET" ;; esac
          server=$(find "$PWD" -type f -name llama-server | head -n1)
          chmod +x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LLAMA_LIB=$(dirname "$server")" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$(dirname "$server")" "$server" --version

      - name: Cache the model
        id: model-cache
        uses: actions/cache@v5
        with:
          path: ~/e2e-model
          key: e2e-gguf-${{ env.MODEL_SHA256 }}

      - name: Download the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/e2e-model
          curl -fsSL --retry 3 -o ~/e2e-model/model.gguf "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" || true

      - name: Verify the model
        run: |
          actual=$(sha256sum ~/e2e-model/model.gguf 2>/dev/null | cut -d' ' -f1)
          if [ "$actual" != "$MODEL_SHA256" ]; then
            # Prints what a new pin needs: the latest revision and the file's checksum there.
            echo "::error::$MODEL_FILE sha256 is '$actual', expected $MODEL_SHA256"
            rev=$(curl -fsSL "https://huggingface.co/api/models/$MODEL_REPO/revision/main" | jq -r .sha) || true
            echo "latest revision: $rev"
            curl -fsSL "https://huggingface.co/api/models/$MODEL_REPO/tree/$rev" | jq -r '.[] | select(.lfs) | "\(.path) \(.lfs.oid) \(.size)"' || true
            rm -f ~/e2e-model/model.gguf
            echo "PIN_PROBLEM=1" >> "$GITHUB_ENV"
          fi
          ls -l ~/e2e-model

      - name: Check the pins
        if: env.PIN_PROBLEM == '1'
        run: |
          echo "::error::A pinned download did not match; see the steps above for the values to pin."
          exit 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v6

      # The app and the on-device AI pack (the offline clip runs a model inside the app).
      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :ondevice-pack:assembleDebug --stacktrace

      - name: Start the model server
        run: |
          nohup env LD_LIBRARY_PATH="$LLAMA_LIB" "$LLAMA_SERVER" \
            -m ~/e2e-model/model.gguf --alias "$MODEL_ALIAS" --jinja \
            --host 127.0.0.1 --port 8080 --ctx-size "$CTX_SIZE" -np 1 -t 2 -tb 2 \
            --cache-reuse 256 --metrics > "$RUNNER_TEMP/llama-server.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/v1/models
          echo
          curl -fsS http://127.0.0.1:8080/props | jq '{n_ctx: .default_generation_settings.n_ctx, build: .build_info}'
          # A tool-calling smoke test straight against the server, so a model or template problem is visible here.
          time curl -fsS http://127.0.0.1:8080/v1/chat/completions -H 'Content-Type: application/json' -d '{
            "model": "'"$MODEL_ALIAS"'",
            "messages": [{"role": "user", "content": "What is the weather in Paris?"}],
            "tools": [{"type": "function", "function": {"name": "get_weather", "description": "Weather for a city",
              "parameters": {"type": "object", "properties": {"city": {"type": "string"}}, "required": ["city"]}}}]
          }' | jq -c '.choices[0].message, .timings'

      # The emulator needs the runner's memory more than the idle Gradle and Kotlin daemons do.
      - name: Free memory for the emulator
        run: |
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          free -m

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pillow
        run: pip install --quiet pillow

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -n1

      - name: Record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            python3 tools/screenshots/install_pack.py ondevice-pack/build/outputs/apk/debug/ondevice-pack-debug.apk
            python3 tools/demo/record.py

      - name: Upload the clips
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-recordings
          path: demo-out/
          retention-days: 14
