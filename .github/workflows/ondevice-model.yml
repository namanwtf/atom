# Runs an on-device catalog model on this runner with the LiteRT-LM runtime version the app ships, on the exact file
# the app's model downloader fetches (same URL and SHA-256 as models/ModelCatalog.kt). It prints the model file's own
# settings and what the model answers to Atom's prompts. No key or secret is used.
name: On-device model

on:
  workflow_dispatch:
  push:
    branches: [fix-ondevice-output]
    paths:
      - tools/ondevice/**
      - .github/workflows/ondevice-model.yml

permissions:
  contents: read

env:
  LITERTLM_VERSION: "0.20.0"   # gradle/libs.versions.toml: litertlm
  MODEL_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/Qwen3-0.6B.litertlm
  MODEL_SHA256: c5f39b4191926786c3e6668b62af4d6eb15248dfc7a5348252a9b406f33f2108

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The Kotlin API of the app's LiteRT-LM
        run: |
          mkdir aar && cd aar
          curl -fsSL -o l.aar "https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/$LITERTLM_VERSION/litertlm-android-$LITERTLM_VERSION.aar"
          unzip -q l.aar classes.jar
          for c in ThinkingConfig Channel 'ModelInfo' 'ModelInfo$Llm' 'ModelInfo$Companion' RepetitionPenaltyConfig NoRepeatNgramConfig Engine SessionConfig; do
            javap -cp classes.jar "com.google.ai.edge.litertlm.$c" 2>/dev/null || true
          done
          # Defaults of ConversationConfig's optional parameters (the synthetic constructor).
          javap -c -cp classes.jar com.google.ai.edge.litertlm.ConversationConfig | sed -n '/DefaultConstructorMarker);/,/return/p' | head -150

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            args: --peek --config before
          - name: after
            args: --config after
    name: probe (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install LiteRT-LM
        run: pip install "litert-lm==$LITERTLM_VERSION"
      - uses: actions/cache@v5
        with:
          path: ~/model
          key: litertlm-${{ env.MODEL_SHA256 }}
      - name: Download the model
        run: |
          mkdir -p ~/model && cd ~/model
          [ -f model.litertlm ] || curl -fsSL --retry 3 -o model.litertlm "$MODEL_URL"
          echo "$MODEL_SHA256  model.litertlm" | sha256sum -c -
      - name: Probe
        run: python3 -u tools/ondevice/litert_probe.py ~/model/model.litertlm ${{ matrix.args }}
