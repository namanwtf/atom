# Publishes a signed Atom release for every push to main. Earlier Atom installs (and this app's own updater) read
# GET /repos/namanwtf/atom/releases/latest, so each run makes one normal (not draft, not pre-release) release
# tagged v4.<minor>.<patch> with atom-<version>.apk and atom-<version>.apk.sha256 attached. See docs/UPDATES.md.
#
# Nothing is committed back to main. The release is created with GITHUB_TOKEN, which never starts other workflow
# runs, so publishing cannot loop. If any signing secret is missing, or the APK is not signed with the earlier
# app's certificate, the job fails before anything is published.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate of the installs this app updates (lower-case, no colons).
  EXPECTED_CERT_SHA256: f3ba9f48e153a99798bb0d7c74c241d8d0c3f9c1db2686f7b50c28f187cb8fa7
  BUILD_TOOLS: "36.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add the release keystore secrets (see docs/UPDATES.md); nothing was published."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Skip a commit that is already released
        id: already
        run: |
          git fetch --force --tags origin
          tag=$(git tag --points-at HEAD --list 'v4.*' | head -n 1)
          if [ -n "$tag" ]; then
            echo "::notice::$GITHUB_SHA is already released as $tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version
        if: steps.already.outputs.skip == 'false'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v4.*.*' | grep -E '^v4\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$prev" ]; then
            version="4.0.0"
          else
            IFS=. read -r major minor patch <<< "${prev#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi

          # versionCode = yyyyMMdd * 100 + 15-minute slot of the UTC day (0..95); never below the committed floor
          # + 1, never below the previous release's code + 1.
          now=$(date -u +%Y%m%d)
          slot=$(( (10#$(date -u +%H) * 60 + 10#$(date -u +%M)) / 15 ))
          stamped=$(( now * 100 + slot ))
          floor=$(grep -E '^\s*versionCode = [0-9]+\s*$' app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1)
          if [ -z "$floor" ]; then echo "::error::No versionCode in app/build.gradle.kts"; exit 1; fi
          previous=0
          if [ -n "$prev" ]; then
            previous=$(gh release view "$prev" --json body -q .body 2>/dev/null \
              | grep -oE 'versionCode [0-9]+' | grep -oE '[0-9]+' | head -n 1 || true)
            previous=${previous:-0}
          fi
          code=$stamped
          if [ $((floor + 1)) -gt "$code" ]; then code=$((floor + 1)); fi
          if [ $((previous + 1)) -gt "$code" ]; then code=$((previous + 1)); fi
          if [ "$code" -gt 2100000000 ]; then echo "::error::versionCode $code exceeds Android's limit"; exit 1; fi

          echo "Previous tag: ${prev:-none} (versionCode $previous); floor $floor; stamped $stamped"
          echo "Releasing v$version with versionCode $code"
          {
            echo "prev=$prev"
            echo "version=$version"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp version into the build (runner only, never committed)
        if: steps.already.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(\s*)versionCode = [0-9]+\s*$/\1versionCode = $CODE/" app/build.gradle.kts
          sed -i -E "s/^(\s*)versionName = \"[^\"]*\"\s*$/\1versionName = \"$VERSION\"/" app/build.gradle.kts
          grep -qE "^\s*versionCode = $CODE$" app/build.gradle.kts
          grep -qE "^\s*versionName = \"$VERSION\"$" app/build.gradle.kts
          grep -qE '^\s*applicationId = "io\.github\.namanwtf\.atom"$' app/build.gradle.kts

      - uses: actions/setup-java@v6
        if: steps.already.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        if: steps.already.outputs.skip == 'false'

      - name: Install NDK and CMake
        if: steps.already.outputs.skip == 'false'
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Install build tools for signing
        if: steps.already.outputs.skip == 'false'
        run: sdkmanager --install "build-tools;${BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v6
        if: steps.already.outputs.skip == 'false'

      - name: Build release APK
        if: steps.already.outputs.skip == 'false'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign and verify
        if: steps.already.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$unsigned" ]; then echo "::error::No release APK was built"; exit 1; fi

          umask 077
          ks="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          mkdir -p dist
          aligned="$RUNNER_TEMP/aligned.apk"
          apk="dist/atom-$VERSION.apk"
          "$bt/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$aligned"
          rm -f "$ks" "$aligned"

          "$bt/apksigner" verify --verbose "$apk"
          certs=$("$bt/apksigner" verify --print-certs "$apk")
          echo "$certs"
          signers=$(grep -cE 'certificate SHA-256 digest:' <<< "$certs" || true)
          actual=$( (grep -E 'Signer #1 certificate SHA-256 digest:' <<< "$certs" || true) | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$signers" != "1" ] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with '$actual' ($signers signer(s)); installs can only update with $EXPECTED_CERT_SHA256. Nothing was published."
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$apk")
          package=$(grep -m 1 -E '^package:' <<< "$badging" || true)
          echo "$package"
          grep -q "name='io.github.namanwtf.atom'" <<< "$package" || { echo "::error::Wrong applicationId"; exit 1; }
          grep -q "versionCode='$CODE'" <<< "$package" || { echo "::error::Wrong versionCode"; exit 1; }
          grep -q "versionName='$VERSION'" <<< "$package" || { echo "::error::Wrong versionName"; exit 1; }

          (cd dist && sha256sum "atom-$VERSION.apk" > "atom-$VERSION.apk.sha256" && cat "atom-$VERSION.apk.sha256")

      - name: Write release notes
        if: steps.already.outputs.skip == 'false'
        env:
          PREV: ${{ steps.version.outputs.prev }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if [ -n "$PREV" ]; then range="$PREV..HEAD"; else range="HEAD"; fi
          {
            echo "## Changelog"
            echo
            git log --no-merges --max-count=200 --format='- %s' "$range"
            echo
            echo "Install \`atom-$VERSION.apk\`. It updates an existing Atom install in place and keeps its data."
            echo
            echo "versionCode $CODE"
            echo
            echo "SHA-256 \`$(cut -d' ' -f1 "dist/atom-$VERSION.apk.sha256")\`"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        if: steps.already.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "dist/atom-$VERSION.apk" "dist/atom-$VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Atom $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
