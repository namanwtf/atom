# Publishes a signed Atom release for the tip of main. Earlier Atom installs (and this app's own updater) read
# GET /repos/namanwtf/atom/releases/latest, so each run makes one normal (not draft, not pre-release) release
# tagged v4.<minor>.<patch> with atom-<version>.apk and atom-<version>.apk.sha256 attached. See docs/UPDATES.md.
#
# Runs on every push to main, or by hand (workflow_dispatch) for main's current tip, e.g. after adding the signing
# secrets. A run releases only main's tip, and only when the previous release is an ancestor of it; a re-run of an
# older push skips with a notice, so older code can never become the latest release.
#
# Nothing is committed back to main. The release is created with GITHUB_TOKEN, which never starts other workflow
# runs, so publishing cannot loop. If a signing secret is missing, the tests fail, or the APK is not signed with the
# earlier app's certificate, the job fails before anything is published.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate of the installs this app updates (lower-case, no colons).
  EXPECTED_CERT_SHA256: f3ba9f48e153a99798bb0d7c74c241d8d0c3f9c1db2686f7b50c28f187cb8fa7
  BUILD_TOOLS: "36.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add the release keystore secrets (see docs/UPDATES.md); nothing was published."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # A manual run releases main's current tip, whatever branch it was started from.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}
          fetch-depth: 0
          submodules: recursive
          # The build never needs the write token; gh gets it through GH_TOKEN only.
          persist-credentials: false

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          skip() {
            echo "::notice::$1 Nothing was published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$head" = "$tip" ] || skip "$head is no longer the tip of main ($tip); the run for the tip releases it."
          released=$(git tag --points-at HEAD --list 'v4.*')
          [ -z "$released" ] || skip "$head is already released as ${released%%$'\n'*}."
          prev=$(git tag --list 'v4.*.*' | grep -E '^v4\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$prev" ] && ! git merge-base --is-ancestor "$prev" HEAD; then
            skip "The previous release $prev is not an ancestor of $head."
          fi
          echo "Releasing $head (previous release: ${prev:-none})"
          {
            echo "skip=false"
            echo "sha=$head"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.plan.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        if: steps.plan.outputs.skip == 'false'

      - name: Install NDK and CMake
        if: steps.plan.outputs.skip == 'false'
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Install build tools for signing
        if: steps.plan.outputs.skip == 'false'
        run: sdkmanager --install "build-tools;${BUILD_TOOLS}"

      - name: Compute version
        if: steps.plan.outputs.skip == 'false'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.plan.outputs.prev }}
        run: |
          set -euo pipefail
          if [ -z "$PREV" ]; then
            version="4.0.0"
          else
            IFS=. read -r major minor patch <<< "${PREV#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi

          # The previous release's versionCode: its notes' own "versionCode N" line (the last one; commit subjects
          # are "- " list items and never match), else the versionCode of its published APK. A previous release
          # whose code cannot be read stops the run: guessing could publish a code Android treats as not newer.
          previous=0
          if [ -n "$PREV" ]; then
            body=$(gh release view "$PREV" --repo "$GITHUB_REPOSITORY" --json body -q .body | tr -d '\r')
            previous=$( (grep -E '^versionCode [0-9]+$' <<< "$body" || true) | tail -n 1 | grep -oE '[0-9]+' || true)
            if [ -z "$previous" ]; then
              dir="$RUNNER_TEMP/previous"
              mkdir -p "$dir"
              gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --pattern 'atom-*.apk' --dir "$dir" --clobber
              apk=$(find "$dir" -maxdepth 1 -name 'atom-*.apk' | head -n 1)
              if [ -n "$apk" ]; then
                badging=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging "$apk")
                previous=$( (grep -m 1 -E '^package:' <<< "$badging" || true) | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+' || true)
              fi
            fi
            if [ -z "$previous" ]; then
              echo "::error::Could not read the versionCode of the previous release $PREV; nothing was published."
              exit 1
            fi
          fi

          # versionCode = yyyyMMdd * 100 + 15-minute slot of the UTC day (0..95); never below the committed floor
          # + 1, never below the previous release's code + 1.
          now=$(date -u +%Y%m%d)
          slot=$(( (10#$(date -u +%H) * 60 + 10#$(date -u +%M)) / 15 ))
          stamped=$(( now * 100 + slot ))
          floor=$(grep -E '^\s*versionCode = [0-9]+\s*$' app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1 || true)
          if [ -z "$floor" ]; then echo "::error::No versionCode in app/build.gradle.kts"; exit 1; fi
          code=$stamped
          if [ $((floor + 1)) -gt "$code" ]; then code=$((floor + 1)); fi
          if [ $((previous + 1)) -gt "$code" ]; then code=$((previous + 1)); fi
          if [ "$code" -gt 2100000000 ]; then echo "::error::versionCode $code exceeds Android's limit"; exit 1; fi

          echo "Previous release: ${PREV:-none} (versionCode $previous); floor $floor; stamped $stamped"
          echo "Releasing v$version with versionCode $code"
          {
            echo "version=$version"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp version into the build (runner only, never committed)
        if: steps.plan.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(\s*)versionCode = [0-9]+\s*$/\1versionCode = $CODE/" app/build.gradle.kts
          sed -i -E "s/^(\s*)versionName = \"[^\"]*\"\s*$/\1versionName = \"$VERSION\"/" app/build.gradle.kts
          grep -qE "^\s*versionCode = $CODE$" app/build.gradle.kts
          grep -qE "^\s*versionName = \"$VERSION\"$" app/build.gradle.kts
          grep -qE '^\s*applicationId = "io\.github\.namanwtf\.atom"$' app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v6
        if: steps.plan.outputs.skip == 'false'

      - name: Unit tests
        if: steps.plan.outputs.skip == 'false'
        run: ./gradlew test testDebugUnitTest --continue --stacktrace

      - name: Build release APK
        if: steps.plan.outputs.skip == 'false'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign and verify
        if: steps.plan.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$unsigned" ]; then echo "::error::No release APK was built"; exit 1; fi

          umask 077
          ks="$RUNNER_TEMP/release.keystore"
          aligned="$RUNNER_TEMP/aligned.apk"
          trap 'rm -f "$ks" "$aligned"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          mkdir -p dist
          apk="dist/atom-$VERSION.apk"
          "$bt/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$aligned"

          "$bt/apksigner" verify --verbose "$apk"
          certs=$("$bt/apksigner" verify --print-certs "$apk")
          echo "$certs"
          signers=$(grep -cE 'certificate SHA-256 digest:' <<< "$certs" || true)
          actual=$( (grep -E 'Signer #1 certificate SHA-256 digest:' <<< "$certs" || true) | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$signers" != "1" ] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with '$actual' ($signers signer(s)); installs can only update with $EXPECTED_CERT_SHA256. Nothing was published."
            exit 1
          fi

          badging=$("$bt/aapt2" dump badging "$apk")
          package=$(grep -m 1 -E '^package:' <<< "$badging" || true)
          echo "$package"
          grep -q "name='io.github.namanwtf.atom'" <<< "$package" || { echo "::error::Wrong applicationId"; exit 1; }
          grep -q "versionCode='$CODE'" <<< "$package" || { echo "::error::Wrong versionCode"; exit 1; }
          grep -q "versionName='$VERSION'" <<< "$package" || { echo "::error::Wrong versionName"; exit 1; }

          (cd dist && sha256sum "atom-$VERSION.apk" > "atom-$VERSION.apk.sha256" && cat "atom-$VERSION.apk.sha256")

      - name: Write release notes
        if: steps.plan.outputs.skip == 'false'
        env:
          PREV: ${{ steps.plan.outputs.prev }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if [ -n "$PREV" ]; then range="$PREV..HEAD"; else range="HEAD"; fi
          {
            echo "## Changelog"
            echo
            git log --no-merges --max-count=200 --format='- %s' "$range"
            echo
            echo "Install \`atom-$VERSION.apk\`. It updates an existing Atom install in place and keeps its data."
            echo
            echo "SHA-256 \`$(cut -d' ' -f1 "dist/atom-$VERSION.apk.sha256")\`"
            echo
            # Read back by the next release; keep it the last line, alone.
            echo "versionCode $CODE"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::main moved to $tip while $SHA was building; the run for the new tip releases it. Nothing was published."
            exit 0
          fi
          gh release create "v$VERSION" \
            "dist/atom-$VERSION.apk" "dist/atom-$VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Atom $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          ok=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '(.isDraft == false and .isPrerelease == false)')
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$ok" != "true" ] || [ "$latest" != "v$VERSION" ]; then
            echo "::error::v$VERSION was published but is a draft/pre-release or not the latest (latest is $latest)."
            exit 1
          fi
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,url --jq '"\(.tagName) \(.url)"'
